[tool.poetry]
name = "pythonstan"
version = "0.2.0"
description = "Python Static Analysis"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "pythonstan"}, {include = "pythonstan_inspector"}]

[tool.poetry.scripts]
pythonstan = "pythonstan.cli:main"
pythonstan-inspector = "pythonstan_inspector.cli:main"

[tool.poetry.dependencies]
python = "^3.12"
pyyaml = "^6.0"
openai = {version = "==3.50.0", optional = true, source = "PyPI"}

[tool.poetry.extras]
openai = ["openai"]

[tool.poetry.group.dev.dependencies]
openai = {version = "==3.50.0", source = "PyPI"}
pytest = "^7.3.1"
flake8 = "^6.0.0"
ruff = {version = "==0.17.4", source = "PyPI"}
mypy = {version = "==2.4.1", source = "PyPI"}
import-linter = {version = "==2.16", source = "PyPI"}
types-PyYAML = {version = "==6.0.12.20261111", source = "PyPI"}


[[tool.poetry.source]]
name = "mirrors"
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple/"
priority = "primary"

[[tool.poetry.source]]
name = "PyPI"
priority = "explicit"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[virtualenvs]
create = true
in-project = true

# Candidate configuration for the next implementation round.
# Merge these tables into the project pyproject.toml; do not replace it wholesale.
# Pin compatible released tool versions in the existing Poetry lockfile during BOOT.

[tool.ruff]
target-version = "py312"
line-length = 100
indent-width = 4
preview = false
unsafe-fixes = false
extend-exclude = ["build", "dist", "benchmark/corpus", "docs/refactor/evidence"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
docstring-code-format = false

[tool.ruff.lint]
select = [
  "E4", "E7", "E9", "F", "I", "UP", "B", "C4", "PIE",
  "RET", "SIM", "ANN", "RUF100", "PGH003", "PGH004",
]
# Never add blanket per-file ignores for the analysis core.

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = false
ignore-fully-untyped = false
mypy-init-return = false
suppress-dummy-args = false
suppress-none-returning = false

[tool.mypy]
python_version = "3.12"
files = ["pythonstan", "pythonstan_inspector"]
strict = true
warn_unreachable = true
warn_unused_configs = true
show_error_codes = true
show_column_numbers = true
disallow_any_unimported = true
disallow_any_explicit = true
enable_error_code = [
  "ignore-without-code", "explicit-override", "exhaustive-match",
  "mutable-override", "possibly-undefined", "unused-awaitable",
]
# Deliberately absent: ignore_errors, ignore_missing_imports, follow_imports=skip.
# Whole-tree diagnostics are captured; legacy debt is managed outside mypy.

[[tool.mypy.overrides]]
module = [
  "pythonstan.analysis.domains.*",
  "pythonstan.analysis.state.*",
]
disallow_any_expr = true
# Canonical state and domain implementations keep expression-level Any checking.
# The quality runner verifies all configured override patterns match modules.

[tool.importlinter]
root_packages = ["pythonstan", "pythonstan_inspector"]
include_external_packages = true
exclude_type_checking_imports = false

[[tool.importlinter.contracts]]
name = "Core cannot depend on orchestration or providers"
type = "forbidden"
source_modules = ["pythonstan.analysis.domains", "pythonstan.analysis.contracts"]
forbidden_modules = [
  "pythonstan.api", "pythonstan.session", "pythonstan.cli",
  "pythonstan.llm", "pythonstan_inspector",
]

[[tool.importlinter.contracts]]
name = "Checker cannot depend on candidate generation"
type = "forbidden"
source_modules = ["pythonstan.analysis.verification"]
forbidden_modules = ["pythonstan.llm", "openai"]

# Additional contracts for engines / semantics / state are added after their
# exact canonical import locations exist, and validated with negative fixtures.
